services:
  - type: web
    name: audiosync-ai-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: CHUNK_SECONDS
        value: "480"
